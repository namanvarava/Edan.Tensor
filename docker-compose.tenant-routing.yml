services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    extra_hosts:
      - "idp.edan.test:192.168.56.101"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Database__Provider: ${Database__Provider:-PostgreSQL}
      ConnectionStrings__PlatformDatabase: ${ConnectionStrings__PlatformDatabase:?Set ConnectionStrings__PlatformDatabase}
      ConnectionStrings__WorkerDatabase: ${ConnectionStrings__WorkerDatabase:?Set ConnectionStrings__WorkerDatabase}
      ConnectionStrings__DataSetDatabase: ${ConnectionStrings__DataSetDatabase:?Set ConnectionStrings__DataSetDatabase}
      ConnectionStrings__DataSetContentDatabase: ${ConnectionStrings__DataSetContentDatabase:?Set ConnectionStrings__DataSetContentDatabase}
      Authentication__Mode: ${Authentication__Mode:-External}
      Authentication__MetadataAddress: ${Authentication__MetadataAddress:?Set Authentication__MetadataAddress}
      Authentication__Issuer: ${Authentication__Issuer:?Set Authentication__Issuer}
      Authentication__Audience: ${Authentication__Audience:-edan-tensor-api}
      TenantDatabaseSecrets__PG_LOCAL__Username: ${TenantDatabaseSecrets__PG_LOCAL__Username:-}
      TenantDatabaseSecrets__PG_LOCAL__Password: ${TenantDatabaseSecrets__PG_LOCAL__Password:-}
      TenantDatabaseSecrets__MSSQL_LOCAL__Username: ${TenantDatabaseSecrets__MSSQL_LOCAL__Username:-}
      TenantDatabaseSecrets__MSSQL_LOCAL__Password: ${TenantDatabaseSecrets__MSSQL_LOCAL__Password:-}
      TenantDatabaseSecrets__ORACLE_LOCAL__Username: ${TenantDatabaseSecrets__ORACLE_LOCAL__Username:-}
      TenantDatabaseSecrets__ORACLE_LOCAL__Password: ${TenantDatabaseSecrets__ORACLE_LOCAL__Password:-}
    ports:
      - "${API_PORT:-5000}:8080"
    volumes:
      - "./app-data:/app/App_Data"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Database__Provider: ${Database__Provider:-PostgreSQL}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PlatformDatabase: ${ConnectionStrings__PlatformDatabase:?Set ConnectionStrings__PlatformDatabase}
      ConnectionStrings__WorkerDatabase: ${ConnectionStrings__WorkerDatabase:?Set ConnectionStrings__WorkerDatabase}
      ConnectionStrings__DataSetDatabase: ${ConnectionStrings__DataSetDatabase:?Set ConnectionStrings__DataSetDatabase}
      ConnectionStrings__DataSetContentDatabase: ${ConnectionStrings__DataSetContentDatabase:?Set ConnectionStrings__DataSetContentDatabase}
    ports:
      - "${WORKER_PORT:-5001}:8080"
    depends_on:
      - api
    restart: unless-stopped
    volumes:
      - ./app-data:/app/App_Data
