services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    extra_hosts:
      - "idp.edan.test:192.168.56.101"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Operations__Profile: ${Operations__Profile:-SME}
      Database__Provider: ${Database__Provider:-Sqlite}
      ConnectionStrings__PlatformDatabase: ${ConnectionStrings__PlatformDatabase:-Data Source=/app/App_Data/edan-framework.db;Cache=Shared}
      ConnectionStrings__WorkerDatabase: ${ConnectionStrings__WorkerDatabase:-Data Source=/app/App_Data/edan-framework.db;Cache=Shared}
      ConnectionStrings__DataSetDatabase: ${ConnectionStrings__DataSetDatabase:-Data Source=/app/App_Data/edan-framework.db;Cache=Shared}
      ConnectionStrings__DataSetContentDatabase: ${ConnectionStrings__DataSetContentDatabase:-Data Source=/app/App_Data/edan-dataset-content.db;Cache=Shared}
      Authentication__Mode: ${Authentication__Mode:-External}
      Authentication__MetadataAddress: ${Authentication__MetadataAddress:?Set Authentication__MetadataAddress}
      Authentication__Issuer: ${Authentication__Issuer:?Set Authentication__Issuer}
      Authentication__Audience: ${Authentication__Audience:-edan-tensor-api}
      TenantDatabaseSecrets__PG_LOCAL__Username: ${TenantDatabaseSecrets__PG_LOCAL__Username:-}
      TenantDatabaseSecrets__PG_LOCAL__Password: ${TenantDatabaseSecrets__PG_LOCAL__Password:-}
      TenantDatabaseSecrets__MSSQL_LOCAL__Username: ${TenantDatabaseSecrets__MSSQL_LOCAL__Username:-}
      TenantDatabaseSecrets__MSSQL_LOCAL__Password: ${TenantDatabaseSecrets__MSSQL_LOCAL__Password:-}
      TenantDatabaseSecrets__ORACLE_LOCAL__Username: ${TenantDatabaseSecrets__ORACLE_LOCAL__Username:-}
      TenantDatabaseSecrets__ORACLE_LOCAL__Password: ${TenantDatabaseSecrets__ORACLE_LOCAL__Password:-}
    ports:
      - "${API_PORT:-5000}:8080"
    volumes:
      - "./app-data:/app/App_Data"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Operations__Profile: ${Operations__Profile:-SME}
      Database__Provider: ${Database__Provider:-Sqlite}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PlatformDatabase: ${ConnectionStrings__PlatformDatabase:-Data Source=/app/App_Data/edan-framework.db;Cache=Shared}
      ConnectionStrings__WorkerDatabase: ${ConnectionStrings__WorkerDatabase:-Data Source=/app/App_Data/edan-framework.db;Cache=Shared}
      ConnectionStrings__DataSetDatabase: ${ConnectionStrings__DataSetDatabase:-Data Source=/app/App_Data/edan-framework.db;Cache=Shared}
      ConnectionStrings__DataSetContentDatabase: ${ConnectionStrings__DataSetContentDatabase:-Data Source=/app/App_Data/edan-dataset-content.db;Cache=Shared}
    ports:
      - "${WORKER_PORT:-5001}:8080"
    depends_on:
      - api
    restart: unless-stopped
    volumes:
      - ./app-data:/app/App_Data
