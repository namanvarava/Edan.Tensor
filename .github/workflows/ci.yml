name: Build and Test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build-and-test:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'namanvarava')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          clean: false
      - name: Runner environment
        run: dotnet --info
      - name: Restore
        run: dotnet restore EDAN.Tensor.sln
      - name: Build
        run: dotnet build EDAN.Tensor.sln --no-restore --configuration Release
      - name: Provider migration and container definition check
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-ef --version 10.*
          $env:PATH = "$env:USERPROFILE/.dotnet/tools;$env:PATH"
          $startupProject = 'src/Hosts/EDAN.Tensor.ApiHost/EDAN.Tensor.ApiHost.csproj'
          $contexts = @('PlatformDbContext', 'WorkerDbContext', 'DataSetDbContext')
          $providers = @(
            @{ Name = 'PostgreSQL'; Project = 'src/Hosts/EDAN.Tensor.PostgreSqlMigrations/EDAN.Tensor.PostgreSqlMigrations.csproj'; Connection = 'Host=localhost;Port=5432;Database=ci;Username=ci;Password=ci' },
            @{ Name = 'SqlServer'; Project = 'src/Hosts/EDAN.Tensor.SqlServerMigrations/EDAN.Tensor.SqlServerMigrations.csproj'; Connection = 'Server=localhost,1433;Database=ci;User Id=ci;Password=ci;TrustServerCertificate=True' },
            @{ Name = 'Oracle'; Project = 'src/Hosts/EDAN.Tensor.OracleMigrations/EDAN.Tensor.OracleMigrations.csproj'; Connection = 'User Id=ci;Password=ci;Data Source=localhost:1521/FREE' }
          )
          foreach ($provider in $providers) {
            $env:Database__Provider = $provider.Name
            $env:ConnectionStrings__PlatformDatabase = $provider.Connection
            $env:ConnectionStrings__WorkerDatabase = $provider.Connection
            $env:ConnectionStrings__DataSetDatabase = $provider.Connection
            $env:ConnectionStrings__DataSetContentDatabase = $provider.Connection
            foreach ($context in $contexts) {
              $output = "$env:RUNNER_TEMP/$context.$($provider.Name).sql"
              dotnet ef migrations script --project $provider.Project --startup-project $startupProject --context $context --configuration Release --no-build --idempotent --output $output
              if ($LASTEXITCODE -ne 0) { throw "$($provider.Name) migration script generation failed for $context" }
              if ((Get-Item $output).Length -eq 0) { throw "Empty $($provider.Name) migration script for $context" }
            }
          }
          $env:Database__Provider = 'Sqlite'
          $env:ConnectionStrings__PlatformDatabase = 'Data Source=:memory:'
          $env:ConnectionStrings__WorkerDatabase = $env:ConnectionStrings__PlatformDatabase
          $env:ConnectionStrings__DataSetDatabase = $env:ConnectionStrings__PlatformDatabase
          $env:ConnectionStrings__DataSetContentDatabase = 'Data Source=:memory:'
          foreach ($context in $contexts) {
            $output = "$env:RUNNER_TEMP/$context.Sqlite.sql"
            dotnet ef migrations script --project $startupProject --startup-project $startupProject --context $context --configuration Release --no-build --output $output
            if ($LASTEXITCODE -ne 0) { throw "SQLite migration script generation failed for $context" }
            if ((Get-Item $output).Length -eq 0) { throw "Empty SQLite migration script for $context" }
          }
          if (Get-Command docker -ErrorAction SilentlyContinue) {
            $env:ConnectionStrings__PlatformDatabase = 'Host=localhost;Database=platform;Username=ci;Password=ci'
            $env:ConnectionStrings__WorkerDatabase = $env:ConnectionStrings__PlatformDatabase
            $env:ConnectionStrings__DataSetDatabase = $env:ConnectionStrings__PlatformDatabase
            $env:ConnectionStrings__DataSetContentDatabase = 'Data Source=/tmp/edan-tensor-dataset-content.db;Cache=Shared'
            $env:Authentication__MetadataAddress = 'https://idp.example.test/realms/ci/.well-known/openid-configuration'
            $env:Authentication__Issuer = 'https://idp.example.test/realms/ci'
            docker compose -f docker-compose.tenant-routing.yml config --quiet
            if ($LASTEXITCODE -ne 0) { throw 'Docker Compose definition is invalid' }
          } else {
            Write-Host 'Docker CLI is unavailable; compose runtime validation is deferred.'
          }
      - name: Test
        run: dotnet test EDAN.Tensor.sln --no-build --no-restore --configuration Release --logger "trx;LogFileName=test-results-${{ github.run_id }}.trx"
      - name: HTTP smoke
        run: dotnet test tests/EDAN.Tensor.ApiHost.IntegrationTests/EDAN.Tensor.ApiHost.IntegrationTests.csproj --no-build --no-restore --configuration Release --filter "FullyQualifiedName~InvitationHttpSmokeCoversTokenLifecycleAndTenantBoundary|FullyQualifiedName~WorkerRawResultHttpSmokeStoresAndStreamsBytes" --logger "trx;LogFileName=http-smoke-${{ github.run_id }}.trx"
      - name: WPF UI smoke
        run: dotnet test tests/EDAN.Tensor.Desktop.Tests/EDAN.Tensor.Desktop.Tests.csproj --no-build --no-restore --configuration Release --filter "FullyQualifiedName~DesktopUiSmokeTests" --logger "trx;LogFileName=wpf-smoke-${{ github.run_id }}.trx"


