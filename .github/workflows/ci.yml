name: Build and Test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build-and-test:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'namanvarava')
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          clean: false
      - name: Runner environment
        run: dotnet --info
      - name: Restore
        run: dotnet restore EDAN.Tensor.sln
      - name: Build
        run: dotnet build EDAN.Tensor.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test EDAN.Tensor.sln --no-build --no-restore --configuration Release --logger "trx;LogFileName=test-results.trx"

